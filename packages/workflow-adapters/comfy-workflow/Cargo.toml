[workspace]
members = ["."]
exclude = ["vendor-sdk/sdk/rust"]

[package]
name = "bgx-comfy-workflow-adapter"
version = "0.1.8"
edition = "2021"
license = "LicenseRef-Proprietary"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bgx-adapter-v2-sdk = { path = "vendor-sdk/sdk/rust" }
bgx-comfy-workflow = { path = "../../../crates/comfy-workflow-core" }
serde_json = { version = "=1.0.149", default-features = false, features = ["alloc"] }
sha2 = { version = "=0.10.9", default-features = false }
hex = { version = "=0.4.3", default-features = false, features = ["alloc"] }

[profile.release]
panic = "abort"
debug = 0
incremental = false
