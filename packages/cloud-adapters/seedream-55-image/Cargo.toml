[workspace]
members = ["."]
exclude = ["vendor-sdk/sdk/rust"]

[package]
name = "bgx-seedream-55-image"
version = "1.0.5"
edition = "2021"
license = "LicenseRef-Proprietary"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bgx-adapter-v2-sdk = { path = "vendor-sdk/sdk/rust" }
serde_json = { version = "=1.0.149", default-features = false, features = ["alloc", "arbitrary_precision"] }
sha2 = { version = "=0.10.9", default-features = false }

base64 = { version = "=0.22.1", default-features = false, features = ["alloc"] }
infer = { version = "=0.19.0", default-features = false }
zune-core = { version = "=0.5.3", default-features = false }
zune-jpeg = { version = "=0.5.15", default-features = false }
zune-png = { version = "=0.5.2", default-features = false }

[dev-dependencies]
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png"] }

[profile.release]
panic = "abort"
debug = 0
incremental = false
