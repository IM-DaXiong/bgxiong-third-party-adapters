[workspace]

[package]
name = "bgxiong-service-adapter"
version = "0.1.1"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
bgx-adapter-v2-sdk = { path = "../../../../bgxiong-adapter-sdk/sdk/rust" }
serde_json = { version = "=1.0.149", default-features = false, features = ["alloc", "arbitrary_precision"] }

[profile.release]
panic = "abort"
